[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmaster"
version = "0.1.0"
description = "A tiny command-line task manager used as the documentation teaching example."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
task = "taskmaster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
