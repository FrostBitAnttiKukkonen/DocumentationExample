name: tests-and-docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e examples/taskmaster pytest
      - run: pytest examples/taskmaster/tests -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r examples/taskmaster/requirements-docs.txt
      - run: zensical build --strict --clean
        working-directory: examples/taskmaster

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docs]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r examples/taskmaster/requirements-docs.txt
      - run: zensical build --clean
        working-directory: examples/taskmaster
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/taskmaster/site
      - id: deployment
        uses: actions/deploy-pages@v4
